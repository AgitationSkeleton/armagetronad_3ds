# Nintendo 3DS built-in controls.
#
# Loaded once per user, only when no user configuration exists yet. Every
# binding here can be changed later under Player Setup.
#
# SDL exposes the console as one joystick with four axes, one hat and ten
# buttons. Axes 0 and 1 are the Circle Pad, axes 2 and 3 are the C-stick of a
# New 3DS or a Circle Pad Pro, the hat is the D-pad, and the buttons are, in
# order, Start, A, B, X, Y, L, R, Select, ZL and ZR.

# --- Driving -----------------------------------------------------------
# The Circle Pad drives exactly like the D-pad: left and right turn, down
# brakes, up does nothing. It used to zoom the camera, which was easy to hold
# by accident while steering and left the view stuck at one extreme.
KEYBOARD JOYSTICK_3DS_BUILTIN_JOYPAD_AXIS_0_- PLAYER_BIND CYCLE_TURN_LEFT 1
KEYBOARD JOYSTICK_3DS_BUILTIN_JOYPAD_AXIS_0_+ PLAYER_BIND CYCLE_TURN_RIGHT 1
KEYBOARD JOYSTICK_3DS_BUILTIN_JOYPAD_AXIS_1_+ PLAYER_BIND CYCLE_BRAKE 1

KEYBOARD JOYSTICK_3DS_BUILTIN_JOYPAD_HAT_0_LEFT PLAYER_BIND CYCLE_TURN_LEFT 1
KEYBOARD JOYSTICK_3DS_BUILTIN_JOYPAD_HAT_0_RIGHT PLAYER_BIND CYCLE_TURN_RIGHT 1
KEYBOARD JOYSTICK_3DS_BUILTIN_JOYPAD_HAT_0_DOWN PLAYER_BIND CYCLE_BRAKE 1

# Brake also sits on the two buttons under a resting thumb.
KEYBOARD JOYSTICK_3DS_BUILTIN_JOYPAD_BUTTON_1 PLAYER_BIND CYCLE_BRAKE 1
KEYBOARD JOYSTICK_3DS_BUILTIN_JOYPAD_BUTTON_2 PLAYER_BIND CYCLE_BRAKE 1

# --- Looking around ----------------------------------------------------
# ZL and ZR repeat L and R, so a New 3DS can glance with either pair and an
# Old 3DS loses nothing.
KEYBOARD JOYSTICK_3DS_BUILTIN_JOYPAD_BUTTON_5 PLAYER_BIND GLANCE_LEFT 1
KEYBOARD JOYSTICK_3DS_BUILTIN_JOYPAD_BUTTON_6 PLAYER_BIND GLANCE_RIGHT 1
KEYBOARD JOYSTICK_3DS_BUILTIN_JOYPAD_BUTTON_8 PLAYER_BIND GLANCE_LEFT 1
KEYBOARD JOYSTICK_3DS_BUILTIN_JOYPAD_BUTTON_9 PLAYER_BIND GLANCE_RIGHT 1

KEYBOARD JOYSTICK_3DS_BUILTIN_JOYPAD_BUTTON_4 PLAYER_BIND GLANCE_BACK 1
KEYBOARD JOYSTICK_3DS_BUILTIN_JOYPAD_BUTTON_3 PLAYER_BIND SWITCH_VIEW 1

# C-stick, on a New 3DS or with a Circle Pad Pro. Free camera look, which the
# desktop client puts on the arrow and numpad keys. Harmless on an Old 3DS
# without the accessory, where these axes never move.
KEYBOARD JOYSTICK_3DS_BUILTIN_JOYPAD_AXIS_2_- PLAYER_BIND LOOK_LEFT 1
KEYBOARD JOYSTICK_3DS_BUILTIN_JOYPAD_AXIS_2_+ PLAYER_BIND LOOK_RIGHT 1
KEYBOARD JOYSTICK_3DS_BUILTIN_JOYPAD_AXIS_3_- PLAYER_BIND BANK_UP 1
KEYBOARD JOYSTICK_3DS_BUILTIN_JOYPAD_AXIS_3_+ PLAYER_BIND BANK_DOWN 1

# --- Everything else ---------------------------------------------------
KEYBOARD JOYSTICK_3DS_BUILTIN_JOYPAD_BUTTON_0 PLAYER_BIND INGAME_MENU 0
KEYBOARD JOYSTICK_3DS_BUILTIN_JOYPAD_BUTTON_7 PLAYER_BIND SCORE 0

# Chat is deliberately not bound. It opens the software keyboard, which takes
# over both screens mid-round, so it does not belong on a button that is easy
# to hit while driving. Bind CHAT under Player Setup if you want it, or use
# the in-game menu.

# BMP is the only screenshot encoder compiled into the 3DS client.
PNG_SCREENSHOT 0

# Cockpit laid out for the 400x240 top screen. The arena map is drawn on the
# touch screen instead of inside the cockpit.
COCKPIT_FILE AATeam/3ds-0.0.1.aacockpit.xml

# --- Sound ---------------------------------------------------------------
# The mix is done on the CPU, in a callback that has to finish before the
# buffer it is filling runs out. This machine renders at about thirty frames a
# second and does the whole legacy sound mix inside that callback, so the
# settings that suit a desktop leave it short of time and the result crackles.
#
# Medium, 22 kHz, which is the default anyway and is stated here so it is
# clear it was chosen. The buffer size is what was actually starving, and that
# is handled in the mixer setup rather than here. Raise this to 3 for 44 kHz
# if the sound holds up; drop to 1 for 11 kHz if it still does not.
SOUND_QUALITY 2

# Fewer simultaneous sources. Each one is mixed in software, and each one adds
# to a sum that saturates: ten cycles nearby is ten times a quarter of full
# scale, which is two and a half times more than there is room for.
SOUND_SOURCES 4

# Effects volume, as a percentage. Lower than the desktop default because
# nothing else here limits how loud the sum gets.
SOUND_VOLUME 60
