name: Build

# Builds the Nintendo 3DS port. Runs on its own for pushes and pull requests,
# and is called by the release workflow so a tag ships exactly what CI built.

on:
  push:
    branches: [ trunk ]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: 3dsx and cia
    runs-on: ubuntu-latest
    # Carries devkitARM, libctru and citro3d. Everything else is either a
    # devkitPro portlib or vendored under platform/3ds/vendor.
    container: devkitpro/devkitarm:latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The version header is derived from the revision count, so a
          # shallow clone would label the build with the wrong one.
          fetch-depth: 0

      - name: Install host tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake python3 unzip
          # The checkout action marks the workspace safe in a HOME it only
          # keeps for itself, so git inside these steps still refuses to look
          # at a tree owned by another user. Version detection reads the
          # history, and a refusal there is silent: it just comes back empty.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # devkitPro's package server answers 403 to the address ranges CI runs
      # in; they would rather people used this image, which already carries the
      # libraries, than have builders pull the same packages over and over.
      # So take stock of what is here and only reach for pacman if something is
      # actually absent.
      - name: Check 3DS libraries
        run: |
          portlibs=/opt/devkitpro/portlibs/3ds/lib
          echo "present:"
          ls "$portlibs" 2>/dev/null | tr '\n' ' ' || echo "  (no portlibs directory)"
          echo
          missing=
          for lib in libSDL.a libSDL_mixer.a libSDL_image.a libpng.a \
                     libjpeg.a libz.a libbz2.a libfreetype.a libcurl.a \
                     libmbedtls.a libmad.a libvorbisidec.a libogg.a \
                     libmikmod.a; do
            [ -f "$portlibs/$lib" ] || missing="$missing $lib"
          done
          if [ -n "$missing" ]; then
            echo "missing:$missing"
            echo "attempting to install them"
            dkp-pacman -Sy --noconfirm --needed \
              3ds-sdl 3ds-sdl_mixer 3ds-sdl_image \
              3ds-libpng 3ds-libjpeg-turbo 3ds-zlib 3ds-bzip2 \
              3ds-freetype 3ds-curl 3ds-mbedtls \
              3ds-libmad 3ds-libvorbisidec 3ds-libogg 3ds-libmikmod
          else
            echo "every library this build links is already in the image"
          fi

      # protobuf and libxml2 take far longer to build than the game does, and
      # they only change when the vendored sources do.
      - name: Restore dependency builds
        uses: actions/cache@v4
        with:
          path: |
            platform/3ds/vendor/libxml2-build-3ds
            platform/3ds/vendor/protobuf-build-3ds
            platform/3ds/vendor/protobuf-build-host
            platform/3ds/vendor/ftgl-build-3ds
          key: deps-${{ runner.os }}-${{ hashFiles('platform/3ds/build-dependencies.sh', 'platform/3ds/vendor/ftgl-build-3ds/Makefile') }}

      - name: Build dependencies
        run: sh platform/3ds/build-dependencies.sh

      - name: Generate version header
        run: sh platform/3ds/make-version-header.sh

      - name: Assemble RomFS
        run: sh platform/3ds/prepare-romfs.sh

      - name: Build
        working-directory: platform/3ds
        run: make -j"$(nproc)"

      - name: Fetch packaging tools
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          curl -fsSL -o "$RUNNER_TEMP/makerom.zip" \
            https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip
          unzip -j -o "$RUNNER_TEMP/makerom.zip" makerom -d "$RUNNER_TEMP/tools"
          # This build of bannertool rather than a newer one: the current
          # releases are linked against glibc 2.38 and the devkitARM image is
          # Debian Bullseye, which has 2.31. This one asks for 2.14.
          curl -fsSL -o "$RUNNER_TEMP/bannertool.zip" \
            https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip
          unzip -j -o "$RUNNER_TEMP/bannertool.zip" linux-x86_64/bannertool \
            -d "$RUNNER_TEMP/tools"
          chmod +x "$RUNNER_TEMP/tools/makerom" "$RUNNER_TEMP/tools/bannertool"

      - name: Package CIA
        env:
          MAKEROM: ${{ runner.temp }}/tools/makerom
          BANNERTOOL: ${{ runner.temp }}/tools/bannertool
        run: sh platform/3ds/package-cia.sh

      - name: Report
        run: |
          cd platform/3ds
          ls -l armagetronad-3ds.3dsx armagetronad-3ds.cia armagetronad-3ds.smdh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: armagetronad-3ds
          if-no-files-found: error
          path: |
            platform/3ds/armagetronad-3ds.3dsx
            platform/3ds/armagetronad-3ds.cia
            platform/3ds/armagetronad-3ds.smdh
